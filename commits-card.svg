<svg xmlns="http://www.w3.org/2000/svg" width="566.3" height="122" viewBox="0 0 566.3 122" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
  text.repo { fill:#c9d1d9; font-size:13px; font-weight:600; }
  text.repo.private { fill:#8b949e; font-style:italic; font-weight:500; }
  text.count { fill:#7d8590; font-size:12px; font-weight:600; opacity:0; animation: fadeInCount 0.4s ease-out both; }
  .bar-track { fill:#21262d; }
  .bar {
    transform-box:fill-box;
    transform-origin:left;
    transform:scaleX(0);
    animation:
      growBar 1.8s cubic-bezier(0.22,0.61,0.36,1) both,
      flash 0.6s ease-out both;
  }
  @keyframes growBar { 0%{transform:scaleX(0);} 100%{transform:scaleX(1);} }
  @keyframes flash { 0%{filter:brightness(1);} 35%{filter:brightness(2.1) saturate(1.3);} 100%{filter:brightness(1);} }
  @keyframes fadeInCount { 0%{opacity:0; transform:translateX(-4px);} 100%{opacity:1; transform:translateX(0);} }
  .row { opacity:0; animation: fadeIn 0.5s ease-out both; }
  @keyframes fadeIn { 0%{opacity:0; transform:translateX(-6px);} 100%{opacity:1; transform:translateX(0);} }

  .divider { stroke:#21262d; stroke-width:1; }
  .panel { opacity:0; animation: fadeInPanel 0.6s ease-out both; }
  @keyframes fadeInPanel { 0%{opacity:0; transform:translateX(4px);} 100%{opacity:1; transform:translateX(0);} }
  text.panel-label { fill:#6e7681; font-size:9.5px; font-weight:700; letter-spacing:0.04em; }
  text.panel-repo { fill:#a8b1bb; font-size:13px; font-weight:600; }
  text.panel-repo.private { fill:#8b949e; font-style:italic; font-weight:500; }
  text.panel-number { fill:#c9d1d9; font-size:30px; font-weight:700; }
  text.panel-lines-add { fill:#3fb950; font-size:22px; font-weight:700; }
  text.panel-lines-del { fill:#f85149; font-size:22px; font-weight:700; }
  text.panel-sub { fill:#7d8590; font-size:10.5px; font-weight:500; }

  @media (prefers-reduced-motion: reduce) { .row, .bar, .count, .panel { opacity:1 !important; transform:none !important; animation:none !important; } }
</style>
<rect width="566.3" height="122" fill="none"/>

      <g class="row" style="animation-delay:0.000s">
        <text class="repo" style="fill:#e3b341" x="20" y="30">mh-datapedia</text>
        <rect class="bar-track" x="20" y="36" width="180" height="6" rx="3" />
        <rect class="bar" x="20" y="36" width="180" height="6" rx="3" fill="#39d353" style="animation-delay:0.000s, 1.800s" />
        <text class="count" x="210" y="40" style="animation-delay:1.800s">315</text>
      </g>
      <g class="row" style="animation-delay:1.175s">
        <text class="repo" style="fill:#b0b7bd" x="20" y="60">j0sMedina</text>
        <rect class="bar-track" x="20" y="66" width="180" height="6" rx="3" />
        <rect class="bar" x="20" y="66" width="31.428571428571427" height="6" rx="3" fill="#39d353" style="animation-delay:1.175s, 2.975s" />
        <text class="count" x="210" y="70" style="animation-delay:2.975s">55</text>
      </g>
      <g class="row" style="animation-delay:2.350s">
        <text class="repo" style="fill:#cd7f32" x="20" y="90">rentatodo</text>
        <rect class="bar-track" x="20" y="96" width="180" height="6" rx="3" />
        <rect class="bar" x="20" y="96" width="4" height="6" rx="3" fill="#39d353" style="animation-delay:2.350s, 4.150s" />
        <text class="count" x="210" y="100" style="animation-delay:4.150s">7</text>
      </g>

      <line class="divider" x1="261" y1="16" x2="261" y2="106" />
      <g class="panel" style="animation-delay:4.400s">
        
        <text class="panel-label" x="278" y="28">MOST PULL REQUESTS</text>
        <text class="panel-label" x="278" y="40">THIS MONTH</text>
        <text class="panel-repo" x="278" y="59">rentatodo</text>
        <text class="panel-number" x="332.3" y="99" text-anchor="middle">15</text>
      </g>
      <line class="divider" x1="403.6" y1="16" x2="403.6" y2="106" />
      <g class="panel" style="animation-delay:4.750s">
        
        <text class="panel-label" x="420.6" y="28">LINES CHANGED</text>
        <text class="panel-label" x="420.6" y="40">THIS MONTH</text>
        <text class="panel-lines-add" x="420.6" y="71">+397</text>
        <text class="panel-lines-del" x="489.16" y="71">-51</text>
        <text class="panel-sub" x="420.6" y="91">rentatodo: +385/-43</text>
      </g>
</svg>